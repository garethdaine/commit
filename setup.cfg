[flake8]
max-line-length = 88
extend-ignore = 
    # Black compatibility
    E203,  # whitespace before ':'
    E501,  # line too long (handled by black)
    W503,  # line break before binary operator
    # Allow certain patterns
    F401,  # imported but unused (in __init__.py files)
exclude = 
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    .eggs,
    *.egg-info,
    .tox,
    .coverage,
    htmlcov,
    .pytest_cache,
    .mypy_cache
per-file-ignores =
    # Allow unused imports in __init__.py files
    __init__.py:F401,F403
    # Allow longer lines in tests for readability
    tests/*:E501
select = 
    E,  # pycodestyle errors
    W,  # pycodestyle warnings
    F,  # pyflakes
    C,  # mccabe complexity
max-complexity = 10
